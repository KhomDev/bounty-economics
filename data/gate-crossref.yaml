# Gate cross-reference — which of this repo's catalogs answers a viability-gate gate.
#
# The three repos share one gate vocabulary (documented in
# rejection-taxonomy/data/SCHEMA.md and used by viability-gate, whose
# docs/gate-mapping.yaml maps each anti-pattern P1..P22 onto a gate token).
# That mapping runs ONE way: a fired anti-pattern -> the gate token it is a
# statement about.
#
# This file closes the loop from the OTHER side, for the two gates that are
# decided by the PROGRAM'S OWN TERMS rather than by the finding's prose: given a
# gate token, which catalog in THIS repo tells you how to read the program page
# so you never reach that gate. It is what makes the two repos compose:
#
#     anti-pattern (viability-gate)  ->  gate token  ->  program-terms catalog (here)
#
# This file is DATA and contains no program data. It names only gate tokens and
# this repo's own catalog ids. It is a JUDGEMENT about which catalog answers a
# gate, authored from the semantics of each gate and each catalog — not a
# re-derivation against any dataset.

version: 1

# Gates decided by the program's published terms. Each names the catalog in this
# repo that classifies the relevant part of the page, and what you read.
answered_here:
  G1_severity_floor:
    catalog: tier-shapes
    read: >-
      The reward table resolves to one tier_shape + floor_status. A finding
      under the floor is worth zero before you write the PoC.
  program_ceiling:
    catalog: tier-shapes
    read: >-
      A program-wide severity ceiling is the critical_only / high_and_above
      shape; it is the same tier_shape judgement, applied to the whole program.
  P16_below_floor:
    catalog: tier-shapes
    read: >-
      "One tier below the floor" is a tier_shape property, not an almost-win:
      the floor the finding fell under is the shape's floor.
  G2_exclusion_clause:
    catalog: clause-classes
    read: >-
      The scope page's out-of-scope list resolves to one of the exclusion
      clause classes, each with its escape hatch.
  G4_prior_audit:
    catalog: prior-audit-surface
    read: >-
      The program's published audits are its prior-audit surface. This repo
      documents that surface in prose (see the README); there is no catalog
      file for it yet, because an audit list, unlike a tier or a clause, cannot
      be published generically without naming the program.

# Gates NOT decided by the program's terms, so this repo does not answer them.
# The signal lives elsewhere; the note says where, so the cross-reference is
# honest about its edges rather than pretending to cover every gate.
not_program_terms:
  D1_duplicate_check: the program's known-issues list and prior reports, not its terms page
  G3_scope_tree: the scoped file tree in the repository, not the terms page
  G5_test_intent: the project's own test suite
  P7_best_practice: a property of the finding (a convention critique), not the program
  P12_no_persisted_impact: a property of the finding (revert-only), not the program
  P17_no_attacker_win: a property of the finding (no beneficiary), not the program
  P18_design_tradeoff: a documented design decision; overlaps G4 but is read from the finding
  P19_headline_mismatch: a property of the report (headline vs PoC), not the program
  P20_cooperating_party: a property of the finding (a second party must act), not the program
  REALISM: attacker-model / configuration realism, read from the finding
